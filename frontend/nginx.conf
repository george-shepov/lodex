server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/virtual/ {
    proxy_pass http://api:8015;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass http://api:8015;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_intercept_errors on;
    error_page 504 = @api_timeout;
  }

  location = /version.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location @api_timeout {
    default_type application/json;
    return 504 '{"detail":"That response took too long. Please try again or request a visit; your conversation is still on this page."}';
  }

  location / {
    try_files $uri /index.html;
  }
}
