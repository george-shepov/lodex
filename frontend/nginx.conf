server {
  listen 80;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  location /api/virtual/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://api:8015;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location /api/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://api:8015;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_intercept_errors on;
    error_page 504 = @api_timeout;
  }

  location = /version.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location = /robots.txt {
    default_type text/plain;
    add_header Cache-Control "public, max-age=3600" always;
    try_files /robots.txt =404;
  }

  location = /sitemap.xml {
    default_type application/xml;
    add_header Cache-Control "public, max-age=3600" always;
    try_files /sitemap.xml =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location = / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files /index.html =404;
  }

  location = /admin {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /admin.html =404;
  }

  location = /admin/ {
    return 308 /admin$is_args$args;
  }

  location ~ ^/designs/[^/]+/[^/]+/?$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /private-shell.html =404;
  }

  location = /inspiration {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files /inspiration.html =404;
  }

  location = /inspiration/ {
    return 308 /inspiration$is_args$args;
  }

  location = /privacy {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files /privacy.html =404;
  }

  location = /privacy/ {
    return 308 /privacy$is_args$args;
  }

  location = /terms {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files /terms.html =404;
  }

  location = /terms/ {
    return 308 /terms$is_args$args;
  }

  location ~ ^/services/(contracting-renovations|handyman-maintenance|white-glove-installation|shopping-sourcing|cleaning-restoration|turnkey-rental-launch|inspection-ready|corporate-housing)$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri.html =404;
  }

  location ~ ^/services/(contracting-renovations|handyman-maintenance|white-glove-installation|shopping-sourcing|cleaning-restoration|turnkey-rental-launch|inspection-ready|corporate-housing)/$ {
    return 308 /services/$1$is_args$args;
  }

  location @api_timeout {
    default_type application/json;
    return 504 '{"detail":"That response took too long. Please try again or request a visit; your conversation is still on this page."}';
  }

  error_page 404 /404.html;

  location = /404.html {
    internal;
  }

  location / {
    try_files $uri $uri.html =404;
  }
}
