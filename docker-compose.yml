services:
  api:
    build: ./backend
    env_file:
      - .env.local
      - ${LODEX_VAULT_ENV_FILE:-.env.local}
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8015:8015"
    networks:
      - default
      - edge

  communications-forwarder:
    build: ./backend
    command: ["python", "communications_forwarder.py"]
    restart: unless-stopped
    env_file:
      - .env.local
      - ${LODEX_VAULT_ENV_FILE:-.env.local}
    volumes:
      - ./data:/app/data
    networks:
      - edge

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:4175:80"
    networks:
      - default
      - edge

networks:
  edge:
    external: true
    name: shepov_edge
