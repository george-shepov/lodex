name: One-time live A2P evidence verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-a2p-live-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public opt-in evidence
        run: |
          set -euo pipefail
          url="https://lodex.work/?a2p_verify=$(date +%s)"
          curl --fail --silent --show-error --max-time 20 \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            -o /tmp/lodex-home "$url"
          grep -Fq 'id="sms-opt-in"' /tmp/lodex-home
          grep -Fq 'Text START to (216) 247-4724 to opt in.' /tmp/lodex-home
          grep -Fq 'Message and data rates may apply.' /tmp/lodex-home
          grep -Fq 'Reply STOP to opt out or HELP for assistance.' /tmp/lodex-home
          grep -Fq 'Consent is optional and is not a condition of purchase.' /tmp/lodex-home
          grep -Fq 'href="/privacy"' /tmp/lodex-home
          grep -Fq 'href="/terms"' /tmp/lodex-home
          echo 'Public LODEX A2P opt-in evidence verified.'
