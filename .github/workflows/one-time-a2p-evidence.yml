name: One-time A2P opt-in evidence update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-a2p-evidence.yml'

permissions:
  contents: write

jobs:
  update-a2p-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add public SMS keyword opt-in CTA
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('frontend/src/App.vue')
          prerender = Path('frontend/scripts/prerender.mjs')

          cta_vue = '\n'.join([
              '      <section id="sms-opt-in" class="service-next">',
              '        <div class="page-width">',
              '          <p class="eyebrow">LODEX text updates</p>',
              '          <h2>Text START to (216) 247-4724 to opt in.</h2>',
              '          <p>Receive service-related SMS/MMS from LODEX about inquiries, estimates, appointments, scheduling, and project updates. Message frequency varies. Message and data rates may apply. Reply STOP to opt out or HELP for assistance. Consent is optional and is not a condition of purchase.</p>',
              '          <div class="hero-actions"><a class="primary-button" href="sms:+12162474724">Text LODEX <span>↗</span></a><a class="phone-link" href="/privacy" @click.prevent="navigate(\'/privacy\')">Privacy Policy</a><a class="phone-link" href="/terms" @click.prevent="navigate(\'/terms\')">Terms &amp; Conditions</a></div>',
              '        </div>',
              '      </section>',
              '',
              '',
          ])

          text = app.read_text()
          if 'id="sms-opt-in"' not in text:
              marker = '      <section id="intake" class="intake-section">'
              if marker not in text:
                  raise SystemExit('App.vue intake marker not found')
              text = text.replace(marker, cta_vue + marker, 1)
          footer_old = '<a href="/#project" @click.prevent="goHome(\'#project\')">Open my project</a><a :href="phoneHref">Call / text {{ phone }}</a>'
          footer_new = '<a href="/#project" @click.prevent="goHome(\'#project\')">Open my project</a><a href="/#sms-opt-in" @click.prevent="goHome(\'#sms-opt-in\')">Text updates</a><a :href="phoneHref">Call / text {{ phone }}</a>'
          if 'Text updates</a><a :href="phoneHref"' not in text:
              if footer_old not in text:
                  raise SystemExit('App.vue footer marker not found')
              text = text.replace(footer_old, footer_new, 1)
          app.write_text(text)

          cta_static = ''.join([
              '\n  <section id="sms-opt-in" class="service-next"><div class="page-width">',
              '<p class="eyebrow">LODEX text updates</p>',
              '<h2>Text START to (216) 247-4724 to opt in.</h2>',
              '<p>Receive service-related SMS/MMS from LODEX about inquiries, estimates, appointments, scheduling, and project updates. Message frequency varies. Message and data rates may apply. Reply STOP to opt out or HELP for assistance. Consent is optional and is not a condition of purchase.</p>',
              '<div class="hero-actions"><a class="primary-button" href="sms:+12162474724">Text LODEX <span>↗</span></a>',
              '<a class="phone-link" href="/privacy">Privacy Policy</a>',
              '<a class="phone-link" href="/terms">Terms &amp; Conditions</a></div></div></section>',
          ])

          text = prerender.read_text()
          if 'id="sms-opt-in"' not in text:
              marker = '</div></section>`\n}\n\nfunction renderService'
              if marker not in text:
                  raise SystemExit('prerender home marker not found')
              text = text.replace(marker, '</div></section>' + cta_static + '`\n}\n\nfunction renderService', 1)
          explore_old = '<span>Explore</span><a href="/inspiration">Inspiration archive</a><a href="/privacy">Privacy Policy</a>'
          explore_new = '<span>Explore</span><a href="/inspiration">Inspiration archive</a><a href="/#sms-opt-in">Text updates</a><a href="/privacy">Privacy Policy</a>'
          if '<a href="/#sms-opt-in">Text updates</a>' not in text:
              if explore_old not in text:
                  raise SystemExit('prerender footer marker not found')
              text = text.replace(explore_old, explore_new, 1)
          prerender.write_text(text)

          assert 'Text START to (216) 247-4724 to opt in.' in app.read_text()
          assert 'Message and data rates may apply.' in app.read_text()
          assert 'Reply STOP to opt out or HELP for assistance.' in app.read_text()
          assert 'id="sms-opt-in"' in prerender.read_text()
          PY

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run test:intake
          npm run build
          grep -Fq 'id="sms-opt-in"' dist/index.html
          grep -Fq 'Text START to (216) 247-4724 to opt in.' dist/index.html
          grep -Fq 'Reply STOP to opt out or HELP for assistance.' dist/index.html

      - name: Commit public A2P evidence
        run: |
          if git diff --quiet -- frontend/src/App.vue frontend/scripts/prerender.mjs; then
            echo 'A2P evidence already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.vue frontend/scripts/prerender.mjs
          git commit -m 'feat: publish A2P SMS opt-in call to action'
          git push origin HEAD:main
