name: Deploy LODEX to VPS

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lodex-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and restart lodex-web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo 'Missing VPS_HOST repository secret' >&2; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          test -n "$VPS_SSH_PRIVATE_KEY" || { echo 'Missing VPS_SSH_PRIVATE_KEY repository secret' >&2; exit 1; }
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/lodex_vps_key
          chmod 600 ~/.ssh/lodex_vps_key

      - name: Verify repository parity and deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER" || { echo 'Missing VPS_USER repository secret' >&2; exit 1; }
          ssh -i ~/.ssh/lodex_vps_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          repo=/home/shepov/deployments/lodex
          compose="$repo/docker-compose.yml"

          cd "$repo"
          git fetch origin main

          # Refuse to deploy over source or configuration that exists only on
          # the VPS. Ignore known runtime state plus disposable editor swap
          # files, which are not source and must never block production deploys.
          vps_changes="$(git status --porcelain --untracked-files=all \
            | grep -v '^?? \.lodex-db\.env$' \
            | grep -Ev '^\?\? .*\.sw[ponx]$' \
            || true)"
          if [ -n "$vps_changes" ]; then
            echo 'VPS checkout contains changes that are not in GitHub:' >&2
            printf '%s\n' "$vps_changes" >&2
            exit 1
          fi

          test "$(git branch --show-current)" = main || {
            echo 'VPS checkout is not on main.' >&2
            exit 1
          }
          git merge --ff-only origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          # Overlay allowlisted LODEX secrets from the encrypted VPS vault.
          # The existing .env.local remains the migration fallback for values
          # that have not been moved yet; vault values take precedence.
          secret_broker=/opt/shepov-vault/bin/apply-app-secrets
          secret_policy=/opt/shepov-vault/app-secret-policies.json
          if [ -x "$secret_broker" ] && [ -f "$secret_policy" ]; then
            if "$secret_broker" lodex --policy-file "$secret_policy"; then
              export LODEX_VAULT_ENV_FILE=/run/shepov-secrets/lodex.env
            else
              echo 'LODEX vault materialization failed; refusing to deploy.' >&2
              exit 1
            fi
          else
            echo 'LODEX vault policy is not installed yet; using the existing private .env.local migration fallback.' >&2
          fi

          docker compose -f "$compose" build api web

          # Docker can briefly report "removal is already in progress" or
          # "No such container" when another VPS-side deploy/cleanup overlaps.
          # Compose is idempotent, so retry the reconciliation after the daemon
          # finishes settling instead of failing an otherwise valid build.
          deploy_attempt=1
          deploy_max_attempts=4
          until docker compose -f "$compose" up -d api web; do
            if [ "$deploy_attempt" -ge "$deploy_max_attempts" ]; then
              echo "Docker Compose deployment failed after $deploy_max_attempts attempts." >&2
              exit 1
            fi

            wait_seconds=$((deploy_attempt * 3))
            echo "Docker Compose hit a transient container-state conflict; retrying in ${wait_seconds}s..." >&2
            sleep "$wait_seconds"
            deploy_attempt=$((deploy_attempt + 1))
          done

          docker compose -f "$compose" ps api web
          REMOTE

      - name: Verify live deployment
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            -D /tmp/lodex-home-headers \
            -o /tmp/lodex-home \
            https://lodex.giorgiy.org/
          grep -qi '^HTTP/.* 200' /tmp/lodex-home-headers

          curl --fail --silent --show-error --max-time 20 \
            -D /tmp/lodex-logo-headers \
            -o /tmp/lodex-logo \
            https://lodex.giorgiy.org/lodex-logo.png
          grep -Eqi '^content-type:[[:space:]]*image/png([;[:space:]]|$)' /tmp/lodex-logo-headers

          echo 'LODEX deployment verified: homepage 200 and lodex-logo.png image/png.'
