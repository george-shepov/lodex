name: Deploy LODEX to VPS

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lodex-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and restart lodex-web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo 'Missing VPS_HOST repository secret' >&2; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          test -n "$VPS_SSH_PRIVATE_KEY" || { echo 'Missing VPS_SSH_PRIVATE_KEY repository secret' >&2; exit 1; }
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/lodex_vps_key
          chmod 600 ~/.ssh/lodex_vps_key

      - name: Verify repository parity and deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER" || { echo 'Missing VPS_USER repository secret' >&2; exit 1; }
          ssh -i ~/.ssh/lodex_vps_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          repo=/home/shepov/deployments/lodex
          compose="$repo/docker-compose.yml"

          cd "$repo"
          git fetch origin main

          # Refuse to deploy over source or configuration that exists only on
          # the VPS. Ignored runtime state (.env.local, data/, build output)
          # remains outside this check by design.
          vps_changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$vps_changes" ]; then
            echo 'VPS checkout contains changes that are not in GitHub:' >&2
            printf '%s\n' "$vps_changes" >&2
            exit 1
          fi

          test "$(git branch --show-current)" = main || {
            echo 'VPS checkout is not on main.' >&2
            exit 1
          }
          git merge --ff-only origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          docker compose -f "$compose" build api web
          docker compose -f "$compose" up -d --force-recreate api web
          docker compose -f "$compose" ps api web
          REMOTE

      - name: Verify live deployment
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            -D /tmp/lodex-home-headers \
            -o /tmp/lodex-home \
            https://lodex.giorgiy.org/
          grep -qi '^HTTP/.* 200' /tmp/lodex-home-headers

          curl --fail --silent --show-error --max-time 20 \
            -D /tmp/lodex-logo-headers \
            -o /tmp/lodex-logo \
            https://lodex.giorgiy.org/lodex-logo.png
          grep -Eqi '^content-type:[[:space:]]*image/png([;[:space:]]|$)' /tmp/lodex-logo-headers

          echo 'LODEX deployment verified: homepage 200 and lodex-logo.png image/png.'
