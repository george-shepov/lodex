name: Browser smoke tests

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/browser-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intake-confidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/e2e/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install browser tests
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run confidence-meter smoke test
        run: npm test
      - name: Upload browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: intake-browser-evidence
          path: |
            frontend/e2e/artifacts
            frontend/e2e/report
          if-no-files-found: ignore
          retention-days: 7
